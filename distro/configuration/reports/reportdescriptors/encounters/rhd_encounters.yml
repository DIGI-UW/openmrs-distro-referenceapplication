key: rhdEncounters
uuid: "d4e5f6a7-b8c9-0123-def0-456789012cde"
name: "RHD Encounters Export"
description: "All RHD encounters within a date range — one row per encounter with patient, type, location and provider"
parameters:
  - key: startDate
    type: java.util.Date
    label: "Start Date"
  - key: endDate
    type: java.util.Date
    label: "End Date"
  - key: clinics
    type: java.lang.String
    label: "Either clinic among these (location uuids separated by commas, no spaces)"
    required: false
datasets:
  - key: encountersData
    type: sql
    config: "sql/rhd_encounters.sql"
designs:
  - type: csv
config:
  privilege: "Task: act.report.encounters"
