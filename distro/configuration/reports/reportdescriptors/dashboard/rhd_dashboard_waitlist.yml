key: rhdDashboardWaitlist
uuid: "9d4e2f7a-1c63-5b08-8a2d-4f6e1b9c3a52"
name: "RHD Dashboard Waitlist"
description: "Counts of the open interventional recommendations by procedure and urgency, and of the balloon valvuloplasties and surgeries completed in the year to the end date, for the Dashboard"
parameters:
  - key: endDate
    type: java.util.Date
    label: "As of date"
  - key: cardiacClinic
    type: java.lang.String
    label: "Cardiac clinic (location uuid)"
    required: false
  - key: primaryCareClinic
    type: java.lang.String
    label: "Primary care clinic (location uuid)"
    required: false
  - key: clinics
    type: java.lang.String
    label: "Either clinic among these (location uuids separated by commas, no spaces)"
    required: false
datasets:
  - key: waitlistData
    type: sql
    config: "sql/rhd_dashboard_waitlist.sql"
designs:
  - type: csv
config:
  privilege: "Task: act.report.dashboard"
